[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ps4d"
version = "1.0.0"
description = "Projective scale complements 4D reconstruction: depth motion of manipulated objects from monocular video"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The PS4D authors" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-learn==1.8.0",   # the released reliability model is a pickled scikit-learn 1.8.0 estimator
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# networks used by the full pipeline (install the third-party packages as described in the README)
gpu = ["torch>=2.4", "torchvision", "pillow", "safetensors", "huggingface_hub", "einops", "timm"]
# dataset conversion and the DROID label certification
data = ["pyyaml", "h5py", "av", "open3d>=0.18"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ps4d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
